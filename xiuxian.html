<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>一念成仙 · 文字修仙</title>
<style>
  :root{
    --bg:#0e0f13; --panel:#151822; --ink:#e7e9ee; --muted:#a9b0c3;
    --accent:#7bd0ff; --good:#7ce38b; --bad:#ff8b8b; --warn:#ffd37b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:ui-sans-serif, system-ui, "PingFang SC","Noto Sans SC","Microsoft YaHei",Arial,sans-serif;
       background: radial-gradient(1000px 600px at 70% -20%, #1a2033, var(--bg)); color:var(--ink); line-height:1.6;}
  header{padding:18px 16px 8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
  h1{font-weight:700;font-size:18px;margin:0;letter-spacing:1px}
  .badge{font-size:12px;color:var(--muted)}
  .wrap{max-width:1080px;margin:0 auto;padding:8px 12px 24px}
  .grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}
  @media (max-width:980px){.grid{grid-template-columns:1fr}}
  .card{background:rgba(255,255,255,0.04);backdrop-filter:saturate(140%) blur(6px); border:1px solid rgba(255,255,255,0.06); border-radius:14px; overflow:hidden}
  .card h2{margin:0;padding:12px 14px;font-size:15px;border-bottom:1px solid rgba(255,255,255,.06);color:#cfe5ff}
  .body{padding:12px 14px}
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .stat{background:linear-gradient(180deg, rgba(255,255,255,0.06),rgba(255,255,255,0.03)); border:1px solid rgba(255,255,255,0.08); border-radius:10px;padding:8px}
  .stat .k{font-size:12px;color:var(--muted)}
  .stat .v{font-size:18px;font-weight:700}
  .flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .pill{padding:6px 10px;border:1px solid rgba(255,255,255,0.14);border-radius:999px;font-size:12px;color:#d1d8f7}
  .event{font-size:16px;margin:6px 0 8px}
  .choices{display:grid;gap:8px}
  button{appearance:none;border:1px solid rgba(255,255,255,.18); background:#1a1f2d; color:var(--ink);
    border-radius:10px;padding:10px 12px; font-size:15px; cursor:pointer; transition:transform .06s ease, background .2s ease, border-color .2s ease; width:100%; text-align:left}
  button:hover{transform:translateY(-1px); background:#232a3f}
  button.primary{background:linear-gradient(180deg,#2a3350,#20263a);border-color:#2e395b; font-weight:700}
  .row{display:flex; gap:8px; flex-wrap:wrap}
  .row > *{flex:1 1 200px}
  .log{max-height:340px; overflow:auto; font-size:14px; padding-right:4px}
  .log p{margin:.5em 0}
  .log .g{color:var(--good)}
  .log .b{color:var(--bad)}
  .meter{height:8px;background:#1b2130;border-radius:999px;overflow:hidden;border:1px solid rgba(255,255,255,.1)}
  .meter>i{display:block;height:100%;background:linear-gradient(90deg,#6ec8ff,#b6f3ff)}
  .footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--muted);gap:8px;flex-wrap:wrap}
  .endings{font-size:15px}
  .kbd{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size:12px; padding:2px 6px; border:1px solid rgba(255,255,255,.2); border-radius:6px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap}
  .toolbar button{flex:0 0 auto;width:auto;text-align:center}
  .panel{display:none}
  .panel.show{display:block}
  .stars{font-size:12px;color:#ffd37b}
  .codex-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media (max-width:720px){.codex-list{grid-template-columns:1fr}}
  .codex-item{border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px;background:rgba(255,255,255,.03)}
  .muted{color:var(--muted)}
  select, .input{background:#1a1f2d;color:var(--ink);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:8px 10px}
  .right{margin-left:auto}
/* 隐藏旧位置的数值面板（仍保留结构，便于以后切换） */
.stats{ display:none; }

/* 徽章数字对齐更清晰 */
.pill{ font-variant-numeric: tabular-nums; }
.pill.stat{ border-color: rgba(255,255,255,0.22); }

/* 行内徽章容器在窄屏依旧优雅换行 */
.pills-wrap{ row-gap:8px; }
</style>
</head>
<body>
  <header class="wrap">
  <div>
    <h1>一念成仙 · 文字修仙</h1>
    <div class="badge">更新：保持原有 UI；核心数据与逻辑全面模块化，便于添加/删除“事件包”“结局包”。内置 3 槽存档与图鉴。</div>
  </div>

  <!-- 改造后的并列徽章区 -->
  <div class="flex pills-wrap">
    <span class="pill" id="agePill">年岁：16</span>
    <span class="pill" id="yearPill">修行：第 1 回</span>
    <span class="pill" id="realmPill">境界：凡人</span>

    <!-- 新增五维数值徽章 -->
    <span class="pill stat" id="pill-body">体魄：5</span>
    <span class="pill stat" id="pill-insight">悟性：5</span>
    <span class="pill stat" id="pill-wealth">资财：5</span>
    <span class="pill stat" id="pill-renown">人脉：5</span>
    <span class="pill stat" id="pill-fate">机缘：5</span>
  </div>
</header>

  <div class="wrap grid">
    <section class="card">
      <h2>当前抉择</h2>
      <div class="body">
        <div class="stats" id="stats"></div>
        <div class="meter" title="总修为"><i id="powerBar" style="width:0%"></i></div>
        <p class="event" id="eventText">你穿越了，带着金手指 "无尽寿元"踏入修行之路……</p>
        <div class="choices" id="choices"></div>
        <div class="row" style="margin-top:8px">
          <button id="nextBtn" class="primary">无为（下一回合）</button>
          <button id="finalBtn" title="随时结算你的因果与归宿">了断因果（立即结局）</button>
          <button id="resetBtn" title="重开一世">重开</button>
        </div>
        <div class="footer">
          <div class="toolbar">
            <button id="saveBtn" title="保存到指定槽位">存档</button>
            <button id="loadBtn" title="从槽位读取">读档</button>
            <select id="slotSelect" title="存档槽位">
              <option value="0">槽位 1</option>
              <option value="1">槽位 2</option>
              <option value="2">槽位 3</option>
            </select>
            <button id="codexBtn" class="right">结局图鉴</button>
          </div>
          <div>快捷键：<span class="kbd">N</span> 下一回，<span class="kbd">F</span> 结局，<span class="kbd">R</span> 重开，<span class="kbd">S</span> 存档，<span class="kbd">L</span> 读档。</div>
        </div>
      </div>
    </section>

    <aside class="card">
      <h2>战报 & 图鉴</h2>
      <div class="body">
        <div class="log" id="log"></div>
        <div id="codexPanel" class="panel">
          <h3 style="margin:8px 0 6px">结局图鉴</h3>
          <div class="muted" id="codexProgress">完成度：0 / 0（0%）</div>
          <div class="codex-list" id="codexList"></div>
        </div>
      </div>
    </aside>
  </div>

  <template id="tpl-stat">
    <div class="stat">
      <div class="k"></div>
      <div class="v"></div>
      <div class="k sub"></div>
    </div>
  </template>

<script>
/* =========================
 * 模块化核心（数据/逻辑）
 * ========================= */
const Game = (()=>{
  // ---- 常量 & 基本工具 ----
  const STAT_META = [
    {key:"body",   name:"体魄", hint:"修武炼体，行则如风"},
    {key:"insight",name:"悟性", hint:"读经悟道，破除执念"},
    {key:"wealth", name:"资财", hint:"以财养道，资源加持"},
    {key:"renown", name:"人脉", hint:"名动一方，八方来援"},
    {key:"fate",   name:"机缘", hint:"气运所钟，奇遇不断"}
  ];
  const STAT_KEYS = STAT_META.map(m=>m.key);
  const SAVE_KEY = "yx_saves_v2";
  const CODEX_KEY = "yx_codex_v2";

  const rarityWeight = (r)=>({ "一般":1, "稀有":2, "超稀有":3 }[r]||1);

  const clampStats = (s)=>{ for(const k of Object.keys(s)){ s[k]=Math.max(0,Math.min(9999,s[k])); } return s; };
  const sumStats = (s)=> Object.values(s).reduce((a,b)=>a+b,0);
  const spread = (s)=>{ const v=Object.values(s); return Math.max(...v)-Math.min(...v); };
  const realmName = (s)=>{
    // 扩展境界：飞升/大乘/化神/元婴/结丹/筑基/炼气/凡人
    const t = sumStats(s);
    if(t>=10000) return "飞升";
    if(t>=4000) return "大乘";
    if(t>=2000) return "化神";
    if(t>=800) return "元婴";
    if(t>=400) return "结丹";
    if(t>=200)  return "筑基";
    if(t>=50)  return "炼气";
    return "凡人";
  };
  const ratios = (s)=>{
    const T=sumStats(s)||1;
    const arr = Object.entries(s).map(([k,v])=>[k,v/T]);
    arr.sort((a,b)=>b[1]-a[1]); return arr;
  };

  // ---- 状态 ----
  const initState = ()=>({
    year:1, age:16, realm:"凡人", // 寿元无限：不会因年龄死亡
    stats:{ body:5, insight:5, wealth:5, renown:5, fate:5 },
    power:0,
    log:[]
  });
  let state = initState();

  // ---- 注册表（事件/奇遇/结局） ----
  const Registry = {
    events: [],      // 全局事件（各境界通用）
    randoms: [],     // 全局随机奇遇
    endings: []      // 结局
  };

  // ---- 公开 API：注册/卸载 ----
  function addEvent(e){ Registry.events.push(e); }
  function removeEvent(id){ Registry.events = Registry.events.filter(x=>x.id!==id); }
  function addRandom(r){ Registry.randoms.push(r); }
  function removeRandom(id){ Registry.randoms = Registry.randoms.filter(x=>x.id!==id); }
  function addEnding(e){ Registry.endings.push(e); }
  function removeEnding(id){ Registry.endings = Registry.endings.filter(x=>x.id!==id); }

  // ---- 选择器 ----
  function weightedPick(arr, weightKey="weight"){
    if(!arr.length) return null;
    const total = arr.reduce((a,b)=> a+(b[weightKey]||1), 0);
    let r = Math.random()*total;
    for(const item of arr){ r -= (item[weightKey]||1); if(r<=0) return item; }
    return arr[arr.length-1];
  }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)] }

  // ---- 存档（3槽） & 图鉴 ----
  function readSaves(){ try{ return JSON.parse(localStorage.getItem(SAVE_KEY)) || [null,null,null]; }catch(e){ return [null,null,null]; } }
  function writeSaves(arr){ localStorage.setItem(SAVE_KEY, JSON.stringify(arr)); }
  function saveToSlot(i){
    const saves = readSaves(); saves[i] = {...state, _time:Date.now()}; writeSaves(saves);
    log(`<span class="g">【已存档】</span> 槽位 ${i+1} （第${state.year}回，${state.realm}）`);
  }
  function loadFromSlot(i){
    const saves = readSaves();
    if(!saves[i]){ log(`<span class="b">【读档失败】</span> 槽位 ${i+1} 为空。`); return; }
    state = {...saves[i]};
    renderAll();
    log(`<span class="g">【已读档】</span> 槽位 ${i+1} （第${state.year}回，${state.realm}）`);
    rollEvent();
  }

  function getCodex(){ try{ return new Set(JSON.parse(localStorage.getItem(CODEX_KEY)) || []);}catch(e){return new Set();} }
  function setCodex(set){ localStorage.setItem(CODEX_KEY, JSON.stringify(Array.from(set))); }
  function unlockEnding(id){ const s=getCodex(); if(!s.has(id)){ s.add(id); setCodex(s); } }

  // ---- Tiny Rule DSL for Endings ----
  const Rule = {
    totalAtLeast:(n)=> (S)=> sumStats(S)>=n,
    totalAtMost:(n)=> (S)=> sumStats(S)<=n,
    totalBetween:(a,b)=> (S)=> sumStats(S)>=a && sumStats(S)<b,
    spreadAtMost:(d)=> (S)=> spread(S)<=d,
    spreadAtLeast:(d)=> (S)=> spread(S)>=d,
    mainIs:(k,minRatio=0.5)=> (S)=> (S[k]||0)/(sumStats(S)||1) >= minRatio,
    topIs:(k1,k2)=> (S)=> { const r=ratios(S); return r[0]?.[0]===k1 && r[1]?.[0]===k2; },
    duo:(sumReq=0.55, secReq=0.22)=> (S)=> { const r=ratios(S); return (r[0][1]+r[1][1] >= sumReq) && (r[1][1] >= secReq); },
    statAtLeast:(k,n)=> (S)=> (S[k]||0)>=n,
    statAtMost:(k,n)=> (S)=> (S[k]||0)<=n,
    not:(fn)=> (S)=> !fn(S),
    all:(...fns)=> (S)=> fns.every(f=>f(S)),
    any:(...fns)=> (S)=> fns.some(f=>f(S)),
    // 年龄规则（寿元无限，仅用作结局条件/展示）
    ageAtLeast:(n)=> (_)=> state.age>=n,
    ageAtMost:(n)=> (_)=> state.age<=n,
  };

  // ---- 结局评定器 ----
  function evaluateEndings(){
    const S = {...state.stats};
    const candidates = Registry.endings.filter(e=> e.test(S));
    if(candidates.length===0){
      return { id:"plain_life", name:"红尘作伴", rarity:"一般",
        desc:()=>`本来无一物，何处惹尘埃。`, score:0, priority:0 };
    }
    const scoreOf = (e)=> rarityWeight(e.rarity)*10000 + (e.priority||0)*100 + sumStats(S);
    candidates.forEach(e=> e.score = scoreOf(e));
    candidates.sort((a,b)=> b.score - a.score);
    return candidates[0];
  }

  // ---- 年龄增长（与境界挂钩，非线性） ----
  const AGE_STEP = {
    "凡人":1, "炼气":2, "筑基":3, "结丹":5, "元婴":10, "化神":20, "大乘":50, "飞升":100
  };

  // ---- 境界倍率（事件与奇遇数值放大） ----
  const REALM_MULT = {
    "凡人":1.00, "炼气":1.15, "筑基":1.35, "结丹":1.70,
    "元婴":2.50, "化神":3.50, "大乘":5.00, "飞升":7.00
  };
  const realmMult = ()=> REALM_MULT[state.realm] || 1;
  function scaleEffects(e){
    const m = realmMult();
    const out = {};
    for(const [k,v] of Object.entries(e)){
      if(v===0) { out[k]=0; continue; }
      const scaled = v>=0 ? Math.max(1, Math.ceil(v*m)) : Math.min(-1, Math.floor(v*m));
      out[k] = scaled;
    }
    return out;
  }

  // ---- 渲染/UI glue ----
  function renderStats(){
  // 不再向 .stats 网格写入（该网格已隐藏）
  const S = state.stats;

  // 更新总修为与进度条
  const total = Object.values(S).reduce((a,b)=>a+b,0);
  state.power = total;
  document.getElementById("powerBar").style.width = Math.min(100, total/2) + "%";

  // 计算并更新境界/年岁/修行回次
  const realm = realmName(state.stats);
  state.realm = realm;
  document.getElementById("realmPill").textContent = `境界：${realm}`;
  document.getElementById("agePill").textContent   = `年岁：${state.age}`;
  document.getElementById("yearPill").textContent  = `修行：第 ${state.year} 回`;

  // 更新页眉中的五维数值徽章
  const set = (id, label, val) => {
    const el = document.getElementById(id);
    if(el) el.textContent = `${label}：${val}`;
  };
  set("pill-body","体魄",   S.body);
  set("pill-insight","悟性",S.insight);
  set("pill-wealth","资财", S.wealth);
  set("pill-renown","人脉", S.renown);
  set("pill-fate","机缘",   S.fate);
}

// ---- 事件系统（按境界分层）｜文案升级版 ----

// 1) 全局基础事件（权重低；风格：仙气/禅意/惊险）
const GlobalBaseEvents = [
  // 仙气·简洁
  {id:"gate_trial", weight:1,
   text:"山门试剑：雪落无声，心最喧。",
   tags:["门派","修行"],
   choices:[
     {label:"石阶苦修（晨昏入定）", effects:{body:+2, insight:+2}},
     {label:"扣关问道（请益一言）", effects:{insight:+3, renown:+1}},
     {label:"同袍结阵（并肩闯关）", effects:{renown:+3, body:+1}},
   ]},

  // 禅意·含蓄
  {id:"market", weight:1,
   text:"坊市烟火：一枚灵石，换几分道缘？",
   tags:["市井","交易"],
   choices:[
     {label:"药炉淬骨（灵药入髓）", effects:{body:+3, wealth:-1}},
     {label:"典籍换悟（抄经参玄）", effects:{insight:+3, wealth:-1}},
     {label:"摆摊走货（四方通商）", effects:{wealth:+3, renown:+1}},
   ]},

  // 惊险·野外
  {id:"grove", weight:1,
   text:"灵林深处：风过，草叶皆诵经。",
   tags:["野外","资源"],
   choices:[
     {label:"猎月之兽（血劲鼓荡）", effects:{body:+2, wealth:+2}},
     {label:"空山听泉（坐忘观心）", effects:{insight:+2, fate:+1}},
     {label:"雾里采芝（结界潜行）", effects:{wealth:+2, fate:+1}},
   ]},
];

// 2) 按境界专属事件（权重高；每条注入不同气质）
const RealmEventBook = {
  // 凡人：励志而清爽（仙气+禅意）
  "凡人":[
    {id:"mr_train", weight:3,
     text:"晨昏磨骨：汗如雨下，心如秋水。",
     choices:[
       {label:"苦炼筋骨（铁石步）", effects:{body:+3, insight:+1}},
       {label:"抄经明心（观息三千）", effects:{insight:+3}},
       {label:"行商走镇（利通四乡）", effects:{wealth:+3, renown:+1}},
     ]}
  ],

  // 炼气：入门细腻（禅意）
  "炼气":[
    {id:"rq_breath", weight:3,
     text:"初引灵息：细如丝，绵如云。",
     choices:[
       {label:"运转小周（气走奇经）", effects:{body:+4, insight:+3}},
       {label:"凝气成丹（篝火煅烟）", effects:{insight:+5, fate:+1, wealth:-2}},
       {label:"斗法试锋（符光交错）", effects:{body:+3, renown:+3}},
     ]}
  ],

  // 筑基：沉稳厚重（禅意+仙气）
  "筑基":[
    {id:"zj_array", weight:3,
     text:"基台落成：四柱镇心，雷音不惊。",
     choices:[
       {label:"阵心坐忘（纹路自行）", effects:{insight:+6, fate:+2, wealth:-2}},
       {label:"灵材淬体（铜骨铁皮）", effects:{body:+7}},
       {label:"结交同道（酒话阵图）", effects:{renown:+6, wealth:+2}},
     ]}
  ],

  // 结丹：丹香满室（仙气）
  "结丹":[
    {id:"jd_pill", weight:3,
     text:"丹室开炉：一丹化虹，香入九曲。",
     choices:[
       {label:"以丹冲关（火候寸断）", effects:{insight:+8, fate:+3, wealth:-3}},
       {label:"洞天悟道（月照清池）", effects:{insight:+10}},
       {label:"护宗大战（金鸣铁啸）", effects:{body:+8, renown:+6}},
     ]}
  ],

  // 元婴：视野辽阔（仙气+奇观）
  "元婴":[
    {id:"yy_out", weight:3,
     text:"婴光离体：星河在掌，一念千山。",
     choices:[
       {label:"星海巡礼（冰火两界）", effects:{insight:+14, fate:+6}},
       {label:"镇妖裂谷（旗落风停）", effects:{body:+12, renown:+10}},
       {label:"万宝争锋（群英逐鹿）", effects:{wealth:+12, fate:+8}},
     ]}
  ],

  // 化神：劫云压顶（惊险）
  "化神":[
    {id:"hs_trib", weight:3,
     text:"劫云压顶：雷为笔，天为纸。",
     choices:[
       {label:"推演劫纹（静看银蛇）", effects:{insight:+18, fate:+12}},
       {label:"破界一步（寸关寸裂）", effects:{body:+16, insight:+10}},
       {label:"千城商盟（道契如山）", effects:{wealth:+20, renown:+14}},
     ]}
  ],

  // 大乘：王者气吞（惊险+恢弘）

  function applyEffects(effects, label){

      const meta = STAT_META.find(m=>m.key===k);

      return `<span class="${color}">${v>=0?"+":""}${v} ${meta?meta.name:k}</span>`;
    }).join("，");
    log(`第${state.year}回：${label?label+" → ":""}${pretty}`);
    renderStats();
  }

  function getRealmEventPool(){
    const realm = state.realm;
    const realmEvents = (RealmEventBook[realm] || []).map(e=>({...e, weight: e.weight ?? 3}));
    const globalEvents = GlobalBaseEvents.map(e=>({...e, weight: e.weight ?? 1}));
    // 同时合并通过 API 注册的通用事件
    const registered = Registry.events.map(e=>({...e, weight: e.weight ?? 1}));
    return [...realmEvents, ...globalEvents, ...registered];
  }

  function nextYear(){
    // 年份 + 感知时间（随境界非线性增加）
    state.year += 1;
    const step = AGE_STEP[state.realm] || 1;
    state.age += step;
    renderStats();

    // 年末小概率奇遇（同样套用境界倍率）
    if(Math.random()<0.6){
      const pool = Registry.randoms.length ? Registry.randoms : BaseRandoms; // 兜底
      if(pool.length){
        const rc = weightedPick(pool) || pool[0];
        const eff = scaleEffects(rc.effects);
        applyEffects(eff, rc.text);
      }
    }
    // 推事件
    rollEvent();
  }

  function rollEvent(){
    const pool = getRealmEventPool();
    if(!pool.length){
      document.getElementById("eventText").textContent = "（无事件已注册）";
      document.getElementById("choices").innerHTML = "";
      return;
    }
    const ev = weightedPick(pool, "weight") || pool[0];
    renderEvent(ev);
  }

  function reset(){
    state = initState();
    document.getElementById("log").innerHTML = "";
    document.getElementById("eventText").textContent = "你背着行囊，踏入修行之路……";
    document.getElementById("choices").innerHTML = "";
    renderStats(); rollEvent();
  }

  function finalize(){
    const e = evaluateEndings();
    unlockEnding(e.id);
    const total = sumStats(state.stats);
    const detail = `（总修为：${total}｜年龄：${state.age}｜比例：`+STAT_KEYS.map(k=>{
      const ratio = total? Math.round(state.stats[k]/total*100):0;
      const n = STAT_META.find(m=>m.key===k).name;
      return `${n}${ratio}%`;
    }).join("，")+`）`;
    const text = `<div class="endings">
      <p><strong>结局：</strong>[${e.rarity}] ${e.name}</p>
      <p>${e.desc(state.stats)}</p>
      <p class="muted">${detail}</p>
    </div>`;
    document.getElementById("eventText").innerHTML = "因果已了结。";
    document.getElementById("choices").innerHTML = text;
    log(`<span class="g">【结局已判】</span> [${e.rarity}] ${e.name}`);
    renderCodex();
  }

  function renderCodex(){
    const set = getCodex();
    const list = document.getElementById("codexList"); list.innerHTML="";
    const total = Registry.endings.length;
    const unlocked = Registry.endings.filter(e=> set.has(e.id)).length;
    const percent = total? Math.round(unlocked/total*100):0;
    document.getElementById("codexProgress").textContent = `完成度：${unlocked} / ${total}（${percent}%）`;
    Registry.endings.forEach(e=>{
      const unlockedFlag = set.has(e.id);
      const div = document.createElement("div"); div.className="codex-item";
      const name = unlockedFlag ? e.name : "？？？";
      const stars = e.rarity==="超稀有" ? "★★★★" : (e.rarity==="稀有" ? "★★★" : "★");
      div.innerHTML = `<strong>${name}</strong> <span class="stars" title="${e.rarity}">${stars}</span> ${unlockedFlag?"":"<span class='muted'>（未解锁）</span>"}<br>
        <span class="muted">编号：${e.id}</span>${e.tags?`<br><span class="muted">标签：${e.tags.join(" / ")}</span>`:""}`;
      list.appendChild(div);
    });
  }

  function renderAll(){ renderStats(); renderCodex(); }

  // ---- 对外暴露 ----
  return {
    STAT_META, STAT_KEYS,
    stateRef:()=>state,
    reset, nextYear, finalize, rollEvent, applyEffects,
    renderAll, renderCodex,

    // registry & packs
    Registry,
    addEvent, removeEvent, addRandom, removeRandom, addEnding, removeEnding,

    // saves & codex
    saveToSlot, loadFromSlot,

    // utils
    Rule, sumStats, spread, realmName, ratios
  };
})();

/* =========================
 * 交互绑定（保持 UI 不变）
 * ========================= */
function render() { Game.renderAll(); Game.rollEvent(); }
document.getElementById("nextBtn").addEventListener("click", ()=> Game.nextYear());
document.getElementById("finalBtn").addEventListener("click", ()=> Game.finalize());
document.getElementById("resetBtn").addEventListener("click", ()=> Game.reset());
document.getElementById("saveBtn").addEventListener("click", ()=>{
  const slot = +document.getElementById("slotSelect").value;
  Game.saveToSlot(slot);
});
document.getElementById("loadBtn").addEventListener("click", ()=>{
  const slot = +document.getElementById("slotSelect").value;
  Game.loadFromSlot(slot);
});
document.getElementById("codexBtn").addEventListener("click", ()=>{
  document.getElementById("codexPanel").classList.toggle("show");
  Game.renderCodex();
});
document.addEventListener("keydown", (e)=>{
  const k=e.key.toLowerCase();
  if(k==="n") Game.nextYear();
  if(k==="f") Game.finalize();
  if(k==="r") Game.reset();
  if(k==="s") document.getElementById("saveBtn").click();
  if(k==="l") document.getElementById("loadBtn").click();
});

// 初始渲染
render();
